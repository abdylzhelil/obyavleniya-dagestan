name: Nov12 narrow negative correction
on:
  push:
    branches: [main]
    paths: ['.github/workflows/direct-test2-nov12-negative.yml']
permissions: {}
concurrency:
  group: direct-bounded-control
  cancel-in-progress: false
jobs:
  correction:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Apply one fixed negative preserving budget and all other settings
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PYCONTROL'
          """Bounded Direct operator; fixed campaign/group, explicit actions, auditable snapshots."""
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request
          from datetime import date, datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo
          
          CAMPAIGN, GROUP = 715775801, 5819958999
          CONTROL_PATH = ".github/direct-control/request.json"
          ALLOWED_NEGATIVES = {"05 ru в махачкале", "сколько стоит картошка в дагестане"}
          ALLOWED_CALLS = {("campaigns", "get"), ("adgroups", "get"), ("adgroups", "update"), ("keywords", "get"), ("ads", "get")}
          
          
          class ControlError(Exception):
              pass
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise urllib.error.HTTPError(req.full_url, code, "Redirect refused", headers, fp)
          
          
          class Direct:
              def __init__(self, token, opener):
                  self.token, self.opener = token, opener
              def call(self, service, method, params):
                  if (service, method) not in ALLOWED_CALLS:
                      raise ControlError("API method forbidden")
                  req = urllib.request.Request(f"https://api.direct.yandex.com/json/v501/{service}",
                      data=json.dumps({"method": method, "params": params}).encode(), method="POST",
                      headers={"Authorization": "Bearer " + self.token, "Content-Type": "application/json", "Accept-Language": "ru"})
                  try:
                      with self.opener.open(req, timeout=45) as response:
                          raw = response.read(1024*1024+1)
                      if len(raw) > 1024*1024:
                          raise ControlError("Response too large")
                      data = json.loads(raw)
                  except urllib.error.HTTPError as error:
                      raise ControlError("HTTP failure " + str(error.code)) from None
                  except (urllib.error.URLError, OSError, ValueError):
                      raise ControlError("API request failed; details suppressed") from None
                  if not isinstance(data, dict) or "error" in data:
                      code = data.get("error", {}).get("error_code") if isinstance(data, dict) else None
                      raise ControlError("Direct API rejected request" + (" code " + str(code) if type(code) is int else ""))
                  if not isinstance(data.get("result"), dict):
                      raise ControlError("Missing API result")
                  return data["result"]
          
          
          def snapshot(api):
              campaigns = api.call("campaigns", "get", {"SelectionCriteria": {"Ids": [CAMPAIGN]}, "FieldNames": ["Id", "State", "Status", "StatusClarification", "Type", "Name", "StartDate", "EndDate", "TimeTargeting"], "UnifiedCampaignFieldNames": ["TrackingParams", "CounterIds", "BiddingStrategy", "PriorityGoals", "Settings"]}).get("Campaigns", [])
              groups = api.call("adgroups", "get", {"SelectionCriteria": {"CampaignIds": [CAMPAIGN], "Ids": [GROUP]}, "FieldNames": ["Id", "CampaignId", "Status", "RegionIds", "NegativeKeywords", "Type", "TrackingParams"]}).get("AdGroups", [])
              result = api.call("keywords", "get", {"SelectionCriteria": {"CampaignIds": [CAMPAIGN], "AdGroupIds": [GROUP]},
                  "FieldNames": ["Id", "AdGroupId", "CampaignId", "Keyword", "State", "Status"],
                  "AutotargetingSettingsCategoriesFieldNames": ["Exact", "Narrow", "Alternative", "Accessory", "Broader"],
                  "AutotargetingSettingsBrandOptionsFieldNames": ["WithoutBrands", "WithAdvertiserBrand", "WithCompetitorsBrand"]})
              keywords = result.get("Keywords", [])
              if len(campaigns) != 1 or campaigns[0].get("Id") != CAMPAIGN:
                  raise ControlError("Campaign identity mismatch")
              if len(groups) != 1 or groups[0].get("Id") != GROUP or groups[0].get("CampaignId") != CAMPAIGN:
                  raise ControlError("Group identity mismatch")
              if result.get("LimitedBy") or any(k.get("CampaignId") != CAMPAIGN or k.get("AdGroupId") != GROUP for k in keywords):
                  raise ControlError("Keywords outside scope or incomplete")
              ads = api.call("ads", "get", {"SelectionCriteria": {"CampaignIds": [CAMPAIGN], "AdGroupIds": [GROUP]}, "FieldNames": ["Id", "CampaignId", "AdGroupId", "Type", "State", "Status", "StatusClarification"], "TextAdFieldNames": ["Title", "Title2", "Text", "Href"], "ResponsiveAdFieldNames": ["Titles", "Texts", "Href", "BusinessId"]})
              return {"campaign": campaigns[0], "group": groups[0], "keywords": sorted(keywords, key=lambda k: k["Id"]), "ads": ads}
          
          
          def revision(settings):
              return hashlib.sha256(json.dumps(settings, sort_keys=True, ensure_ascii=False, separators=(",", ":")).encode()).hexdigest()
          
          
          def main():
              token=os.environ.get("YANDEX_DIRECT_TOKEN","").strip()
              record={"captured_at_utc":datetime.now(timezone.utc).isoformat(),"applied":False,"verified":False,
                      "reason":"Owner requests one evidence-based improvement on12Nov; query все объявления на авито в р дагестан spent1.22net for navigation to another platform",
                      "phrase":"все объявления на авито"}
              out=Path("direct-control");out.mkdir(exist_ok=True)
              try:
                  now=datetime.now(timezone.utc);issued=datetime.fromisoformat("2026-11-12T19:31:26+00:00")
                  if not 0 <= (now-issued).total_seconds() <=900 or now.astimezone(ZoneInfo("Europe/Moscow")).date()!=date(2026,11,12):
                      raise ControlError("Expired one-time optimization")
                  if os.environ.get("GITHUB_RUN_ATTEMPT")!="1" or not token:raise ControlError("No blind retry or missing secret")
                  api=Direct(token,urllib.request.build_opener(NoRedirect()))
                  before=snapshot(api);record["before"]=before
                  expected=json.loads("{\"captured_at_utc\": \"2026-11-12T19:30:06.295219+00:00\", \"applied\": false, \"verified\": true, \"request\": {\"action\": \"inspect\", \"campaign_id\": 715775801, \"group_id\": 5819958999}, \"before\": {\"campaign\": {\"Id\": 715775801, \"Name\": \"Объявления Дагестана — WhatsApp — тест 2\", \"StartDate\": \"2026-11-12\", \"Type\": \"UNIFIED_CAMPAIGN\", \"Status\": \"ACCEPTED\", \"State\": \"ON\", \"StatusClarification\": \"Показы начнутся завтра в 8:00. Дата окончания кампании 18.11.2026\", \"EndDate\": \"2026-11-18\", \"UnifiedCampaign\": {\"BiddingStrategy\": {\"Search\": {\"BiddingStrategyType\": \"WB_MAXIMUM_CLICKS\", \"WbMaximumClicks\": {\"CustomPeriodBudget\": {\"SpendLimit\": 500000000, \"StartDate\": \"2026-11-12\", \"EndDate\": \"2026-11-18\", \"AutoContinue\": \"NO\"}, \"BudgetType\": \"CUSTOM_PERIOD_BUDGET\", \"BidCeiling\": null}}, \"Network\": {\"BiddingStrategyType\": \"SERVING_OFF\"}}, \"Settings\": [{\"Option\": \"ADD_METRICA_TAG\", \"Value\": \"NO\"}, {\"Option\": \"ADD_TO_FAVORITES\", \"Value\": \"NO\"}, {\"Option\": \"CAMPAIGN_EXACT_PHRASE_MATCHING_ENABLED\", \"Value\": \"NO\"}, {\"Option\": \"ALTERNATIVE_TEXTS_ENABLED\", \"Value\": \"NO\"}, {\"Option\": \"AUTO_ASSETS_ENABLED\", \"Value\": \"NO\"}, {\"Option\": \"ENABLE_AREA_OF_INTEREST_TARGETING\", \"Value\": \"YES\"}, {\"Option\": \"ENABLE_COMPANY_INFO\", \"Value\": \"YES\"}, {\"Option\": \"ENABLE_SITE_MONITORING\", \"Value\": \"NO\"}, {\"Option\": \"REQUIRE_SERVICING\", \"Value\": \"NO\"}, {\"Option\": \"SHARED_ACCOUNT_ENABLED\", \"Value\": \"YES\"}], \"TrackingParams\": \"utm_source=yandex&utm_medium=cpc&utm_campaign=dagestan_whatsapp_test2_20261112&utm_content={ad_id}&utm_term={keyword}\", \"PriorityGoals\": {\"Items\": [{\"GoalId\": 668953269, \"Value\": 300000, \"IsMetrikaSourceOfValue\": \"NO\"}]}, \"CounterIds\": {\"Items\": [113403438]}}, \"TimeTargeting\": {\"HolidaysSchedule\": null, \"Schedule\": {\"Items\": [\"1,0,0,0,0,0,0,0,0,100,100,100,100,100,100,100,100,100,100,100,100,100,100,0,0\", \"2,0,0,0,0,0,0,0,0,100,100,100,100,100,100,100,100,100,100,100,100,100,100,0,0\", \"3,0,0,0,0,0,0,0,0,100,100,100,100,100,100,100,100,100,100,100,100,100,100,0,0\", \"4,0,0,0,0,0,0,0,0,100,100,100,100,100,100,100,100,100,100,100,100,100,100,0,0\", \"5,0,0,0,0,0,0,0,0,100,100,100,100,100,100,100,100,100,100,100,100,100,100,0,0\", \"6,0,0,0,0,0,0,0,0,100,100,100,100,100,100,100,100,100,100,100,100,100,100,0,0\", \"7,0,0,0,0,0,0,0,0,100,100,100,100,100,100,100,100,100,100,100,100,100,100,0,0\"]}, \"ConsiderWorkingWeekends\": \"YES\"}}, \"group\": {\"Id\": 5819958999, \"CampaignId\": 715775801, \"Status\": \"ACCEPTED\", \"Type\": \"UNIFIED_AD_GROUP\", \"RegionIds\": [11010], \"NegativeKeywords\": {\"Items\": [\"05 ru !в махачкале\", \"бот\", \"купить подписчиков\", \"накрутка\", \"скачать Telegram\", \"скачать WhatsApp\", \"скачать приложение\", \"сколько стоит картошка !в дагестане\", \"создание групп\", \"создать группу\"]}, \"TrackingParams\": \"\"}, \"keywords\": [{\"Id\": 58412964936, \"Keyword\": \"группа объявлений Дагестан WhatsApp\", \"AdGroupId\": 5819958999, \"CampaignId\": 715775801, \"State\": \"ON\", \"Status\": \"ACCEPTED\"}, {\"Id\": 58412964937, \"Keyword\": \"объявления Дагестан ватсап группа\", \"AdGroupId\": 5819958999, \"CampaignId\": 715775801, \"State\": \"ON\", \"Status\": \"ACCEPTED\"}, {\"Id\": 58412964938, \"Keyword\": \"вступить в группу объявлений Дагестан\", \"AdGroupId\": 5819958999, \"CampaignId\": 715775801, \"State\": \"ON\", \"Status\": \"ACCEPTED\"}, {\"Id\": 58412964939, \"Keyword\": \"разместить объявление Дагестан WhatsApp\", \"AdGroupId\": 5819958999, \"CampaignId\": 715775801, \"State\": \"ON\", \"Status\": \"ACCEPTED\"}, {\"Id\": 205819958999, \"Keyword\": \"---autotargeting\", \"AdGroupId\": 5819958999, \"CampaignId\": 715775801, \"State\": \"ON\", \"Status\": \"ACCEPTED\", \"AutotargetingSettings\": {\"Categories\": {\"Exact\": \"YES\", \"Narrow\": \"NO\", \"Alternative\": \"NO\", \"Accessory\": \"NO\", \"Broader\": \"NO\"}, \"BrandOptions\": {\"WithoutBrands\": \"YES\", \"WithAdvertiserBrand\": \"YES\", \"WithCompetitorsBrand\": \"YES\"}}}], \"ads\": {\"Ads\": [{\"Id\": 1926010917047642292, \"CampaignId\": 715775801, \"AdGroupId\": 5819958999, \"Status\": \"ACCEPTED\", \"State\": \"ON\", \"StatusClarification\": \"Активно.\", \"Type\": \"RESPONSIVE_AD\", \"ResponsiveAd\": {\"Texts\": [{\"Text\": \"Вступайте в WhatsApp-группу Дагестана. Объявления бесплатно по правилам.\", \"Status\": \"ACCEPTED\"}, {\"Text\": \"Размещайте обычные объявления бесплатно. Коммерческая реклама — платно.\", \"Status\": \"ACCEPTED\"}], \"Titles\": [{\"Title\": \"Объявления Дагестана в WhatsApp\", \"Status\": \"ACCEPTED\"}, {\"Title\": \"Вступайте в группу объявлений\", \"Status\": \"ACCEPTED\"}], \"Href\": \"https://obyavleniya-dagestan.ru/group-whatsapp-2.html\", \"BusinessId\": null}}]}}, \"revision\": \"50f3cf92bc949e479e9567657c16632e773818a08e2187c028f31307b9adbec0\", \"status\": \"read_only_inspection\"}")["before"]
                  def stable(v):
                      if isinstance(v,dict):return {k:stable(x) for k,x in v.items() if k not in ("Status","StatusClarification")}
                      if isinstance(v,list):return [stable(x) for x in v]
                      return v
                  record["expected_revision"]=revision(stable(expected))
                  if revision(stable(before))!=record["expected_revision"]:raise ControlError("Settings changed since inspection")
                  budget=before["campaign"]["UnifiedCampaign"]["BiddingStrategy"]["Search"]["WbMaximumClicks"]["CustomPeriodBudget"]
                  if budget!={"SpendLimit":500000000,"StartDate":"2026-11-12","EndDate":"2026-11-18","AutoContinue":"NO"}:raise ControlError("Wrong test budget or dates")
                  old=before["group"]["NegativeKeywords"]["Items"];phrase=record["phrase"]
                  def norm(x):return " ".join(x.casefold().replace("!на","на").split())
                  if norm(phrase) in {norm(x) for x in old}:raise ControlError("Already present; do not repeat")
                  merged=old+[phrase]
                  record["request"]={"AdGroups":[{"Id":GROUP,"NegativeKeywords":{"Items":merged}}]}
                  record["applied"]=True
                  result=api.call("adgroups","update",record["request"]);record["result"]=result
                  rows=result.get("UpdateResults",[])
                  if len(rows)!=1 or rows[0].get("Id")!=GROUP or rows[0].get("Errors"):raise ControlError("Rejected/partial; inspect before retry")
                  after=snapshot(api);record["after"]=after
                  got=after["group"]["NegativeKeywords"]["Items"]
                  target=json.loads(json.dumps(before));target["group"]["NegativeKeywords"]=after["group"]["NegativeKeywords"]
                  record["checks"]={"only_approved_phrase_added":{norm(x) for x in got}=={norm(x) for x in merged} and len(got)==len(merged),
                                    "all_other_settings_preserved":stable(after)==stable(target)}
                  if not all(record["checks"].values()):raise ControlError("Readback mismatch; inspect before retry")
                  record["verified"]=True;record["status"]="one_negative_applied_verified"
              except Exception as e:
                  record["status"]="failed_inspect_before_retry";record["error"]=str(e).replace(token,"[REDACTED]") if token else "Missing secret"
                  if record["applied"]:
                      try:record["after_failure"]=snapshot(api)
                      except Exception:record["after_failure_unavailable"]=True
              data=json.dumps(record,ensure_ascii=False)
              if token:data=data.replace(token,"[REDACTED]")
              (out/"result.json").write_text(data,encoding="utf-8");print(data)
              return 0 if record["verified"] else 1
          
          if __name__=="__main__":sys.exit(main())
          
          PYCONTROL
      - name: Save before and after
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nov12-negative-${{ github.run_id }}
          path: direct-control/
          retention-days: 30
