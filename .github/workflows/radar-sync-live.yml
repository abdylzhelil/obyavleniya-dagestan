name: Verify published synchronized radar
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/radar-sync-live.yml"
permissions: {}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install pinned browser library
        run: npm install --prefix /tmp/radar-review --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Preview and test proposed component only
        run: |
          node <<'JS'
          const {chromium}=require('/tmp/radar-review/node_modules/playwright');
          const fs=require('fs'),cp=require('child_process'),path=require('path');
          const assert=(x,m)=>{if(!x)throw Error(m)};
          (async()=>{
            const root=path.resolve('review');fs.mkdirSync(root,{recursive:true});
            for(let n=0;n<24;n++){const res=await fetch('https://obyavleniya-dagestan.ru/?radar_verify='+Date.now());const html=await res.text();if(html.includes('kr-cards'))break;if(n===23)throw Error('Published HTML not ready');await new Promise(r=>setTimeout(r,5000));}
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const out={captured_at_utc:new Date().toISOString(),source_revision:process.env.GITHUB_SHA,scope:'actual published pages; analytics blocked',cases:[]};
            try{
              for(const page of ['index.html','bot-crm.html'])for(const width of [1440,390])for(const reduced of ['no-preference','reduce']){
                const c=await b.newContext({viewport:{width,height:1000},reducedMotion:reduced});
                await c.route('**/*',async route=>{const u=new URL(route.request().url());if(/(^|\.)mc\.yandex\./.test(u.hostname)||/\.(mp4|webm)(\?|$)/.test(u.href))return route.abort();return route.continue();});
                const p=await c.newPage(),errors=[];p.on('pageerror',e=>errors.push(e.message));
                await p.goto('https://obyavleniya-dagestan.ru/'+page+'?radar_verify=20261114sync',{waitUntil:'domcontentloaded',timeout:45000});
                const decline=p.getByRole('button',{name:'Отказаться',exact:true});if(await decline.count())await Promise.all([p.waitForEvent('load'),decline.click()]);
                const demo=p.locator('.kr-demo');await demo.scrollIntoViewIfNeeded();await p.waitForTimeout(250);
                const changed=async()=>{const first=await demo.locator('.kr-scan').evaluate(e=>getComputedStyle(e).transform);await p.waitForTimeout(350);return first!==await demo.locator('.kr-scan').evaluate(e=>getComputedStyle(e).transform)};
                const toggle=demo.locator('button');assert(await toggle.isVisible(),'Control visible');
                assert(await changed()===(reduced==='no-preference'),'Initial motion preference');
                if(reduced==='reduce'){await toggle.click();assert(await changed(),'Reduced opt-in');}
                await toggle.click();await p.waitForTimeout(200);console.log('PAUSE_DEBUG '+JSON.stringify(await demo.evaluate(e=>({classes:e.className,button:e.querySelector('button').outerHTML,scan:getComputedStyle(e.querySelector('.kr-scan')).animationPlayState,animations:e.querySelector('.kr-scan').getAnimations().map(a=>({name:a.animationName,state:a.playState}))}))));assert(!await changed(),'Pause');await toggle.focus();await p.keyboard.press('Space');assert(await changed(),'Keyboard resume');
                assert(await p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'No horizontal overflow');
                const box=await demo.boundingBox();assert(box.x>=0&&box.x+box.width<=width+1,'Demo within viewport');
                assert(errors.length===0,'Page errors '+errors.join(','));

                const seek=async ms=>{await demo.locator('.kr-scan,.kr-target,.kr-echo,.kr-lead-copy,.kr-check').evaluateAll((es,t)=>es.forEach(e=>e.getAnimations().forEach(a=>{a.pause();a.currentTime=t;})),ms);await p.waitForTimeout(35);};
                for(const [time,card] of [[1950,'kr-card-three'],[2050,'kr-card-one'],[5950,'kr-card-one'],[6050,'kr-card-two'],[9950,'kr-card-two'],[10050,'kr-card-three'],[14050,'kr-card-one']]){
                  await seek(time);
                  const visible=await demo.locator('.kr-lead-copy').evaluateAll(es=>es.filter(e=>getComputedStyle(e).visibility==='visible').map(e=>e.className));
                  assert(visible.length===1&&visible[0].includes(card),'Exact card at '+time+': '+visible);
                }
                for(const [time,index,angle] of [[2050,0,60],[6050,1,180],[10050,2,300]]){
                  await seek(time);
                  assert(await demo.locator('.kr-target').nth(index).evaluate(e=>Number(getComputedStyle(e).opacity)>.9),'Point lights at beam hit');
                  assert(await demo.locator('.kr-echo').nth(index).evaluate(e=>Number(getComputedStyle(e).opacity)>.1),'Point ripple at beam hit');
                  const actual=await demo.locator('.kr-scan').evaluate(e=>{const m=new DOMMatrix(getComputedStyle(e).transform);return (Math.atan2(m.b,m.a)*180/Math.PI+360)%360});
                  assert(Math.abs(actual-(angle+1.5))<.3,'Beam angle and detection agree');
                }
                if(page==='bot-crm.html'&&width===1440&&reduced==='no-preference'){
                  await demo.locator('.kr-scan,.kr-target,.kr-echo,.kr-lead-copy,.kr-check').evaluateAll(es=>es.forEach(e=>e.getAnimations().forEach(a=>{a.pause();a.currentTime=3200;})));
                  const shot=await demo.screenshot({type:'jpeg',quality:82});fs.writeFileSync(path.join(root,'radar-v2.jpg'),shot);console.log('RADAR_IMAGE '+shot.toString('base64'));
                }
                out.cases.push({page,width,reduced,toggle:true,keyboard:true,no_overflow:true,three_synced_hits:true,card_wraparound:true,point_ripples:true,errors});await c.close();
              }
              out.status='passed';
            }finally{await b.close();fs.writeFileSync(path.join(root,'result.json'),JSON.stringify(out,null,2));console.log('RADAR_RESULT '+JSON.stringify(out));}
          })().catch(e=>{console.log('RADAR_ERROR '+e.stack);process.exitCode=1});
          JS
      - name: Save preview and checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radar-v2-review-${{ github.run_id }}
          path: review/
          retention-days: 30
