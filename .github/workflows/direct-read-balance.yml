name: Read shared account balance
on:
  workflow_dispatch:
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read aggregate balance only
        env:
          YANDEX_DIRECT_TOKEN: ${{ secrets.YANDEX_DIRECT_TOKEN }}
        run: |
          python3 - <<'PYBAL'
          import json,os,urllib.request
          from datetime import datetime,timezone
          from decimal import Decimal
          from pathlib import Path
          token=os.environ.get("YANDEX_DIRECT_TOKEN","").strip()
          record={"captured_at_utc":datetime.now(timezone.utc).isoformat(),"operation":"AccountManagement.Get","scope":"read-only balance; no financial operation; only aggregate Amount and Currency saved"}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):raise RuntimeError("Redirect refused")
          try:
              if not token:raise ValueError("Missing OAuth secret")
              payload={"method":"AccountManagement","param":{"Action":"Get","SelectionCriteria":{}},"token":token,"locale":"ru"}
              req=urllib.request.Request("https://api.direct.yandex.ru/live/v4/json/",data=json.dumps(payload).encode(),method="POST",headers={"Authorization":"Bearer "+token,"Content-Type":"application/json","Accept-Language":"ru"})
              with urllib.request.build_opener(NoRedirect()).open(req,timeout=40) as response:data=json.loads(response.read(1048576))
              if "error_code" in data:
                  record["api_error_code"]=data.get("error_code");raise ValueError("API rejected request")
              accounts=data.get("data",{}).get("Accounts",[])
              if len(accounts)!=1:
                  record["account_count"]=len(accounts);raise ValueError("Ambiguous account selection")
              a=accounts[0];amount=Decimal(str(a["Amount"]))
              if not amount.is_finite():raise ValueError("Invalid balance")
              record.update(status="complete",amount=str(amount),currency=a.get("Currency"),money_units="account currency, not micros")
          except Exception as e:
              record.update(status="failed",error_type=type(e).__name__)
              if hasattr(e,"code"):record["http_status"]=e.code
          text=json.dumps(record,ensure_ascii=False)
          if token:text=text.replace(token,"[REDACTED]")
          Path("balance-check").mkdir(exist_ok=True)
          Path("balance-check/result.json").write_text(text)
          print("BALANCE_READ "+text)
          if record["status"]!="complete":raise SystemExit(1)
          
          PYBAL
      - name: Preserve aggregate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: balance-${{ github.run_id }}
          path: balance-check/
          retention-days: 30
